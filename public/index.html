<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Béjaïa Tour — the pearl of the Mediterranean</title>
    <meta name="description" content="Discover Béjaïa (Saldae), Algeria: Cap Carbon, Yemma Gouraya, Tichy, the Aokas caves and a thousand-year-old medina. Places, film, practical tips and trip planning." />
    <meta name="theme-color" content="#0b2530" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta property="og:title" content="Béjaïa Tour — the pearl of the Mediterranean" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the saved theme before the first paint to avoid a light flash in dark mode.
      try {
        var t = localStorage.getItem('bejaia-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
